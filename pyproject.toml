[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "budget-tracker"
version = "0.1.0"
description = "A personal budget and expense tracking CLI with reports and budgets."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }]
dependencies = ["click>=8.0.0", "rich>=13.0.0"]

[project.scripts]
budget = "budget_tracker.cli:main"

[project.urls]
Homepage = "https://github.com/Master-626/budget-tracker"
